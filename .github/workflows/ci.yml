name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . scipy pytest "ruff==0.16.2"
      - run: ruff check .
      # cyipopt needs Ipopt binaries; the suite importorskips it, and the
      # scipy solve covers the solver path hermetically.
      - run: pytest -q
