[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnlpmodels"
version = "0.1.0"
license = {file = "LICENSE"}
description = "Consume C-ABI NLP shared libraries (e.g. ExaModels-compiled) as numpy-backed models — no Julia required"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
ipopt = ["cyipopt"]

[tool.setuptools.packages.find]
where = ["src"]
